name: Android build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'camera-core/**'
      - 'scripts/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xflip-android-build
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0"
      - name: Test direction core and build Android app
        run: gradle --no-daemon :camera-core:check :app:assembleStandardDebug :app:assembleCoverCompatDebug :app:lintStandardDebug :app:lintCoverCompatDebug
      - name: Upload APK and lint report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xflip-camera-debug
          path: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/reports/lint-results-*Debug.html
          if-no-files-found: error
          retention-days: 7

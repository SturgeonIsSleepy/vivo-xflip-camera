plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.register('coreChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sturgeon.xflipcamera.core.CoreChecks'
}

tasks.named('check') {
    dependsOn 'coreChecks', 'photoEvidenceChecks'
}

tasks.register('photoEvidenceChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.sturgeon.xflipcamera.core.PhotoEvidenceChecks'
    workingDir = rootProject.projectDir
    systemProperty 'java.awt.headless', 'true'
}

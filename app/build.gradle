plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sturgeon.xflipcamera'
    buildFeatures { buildConfig true }
    compileSdk 36

    defaultConfig {
        applicationId 'com.sturgeon.xflipcamera'
        minSdk 33
        targetSdk 36
        ndk { abiFilters 'arm64-v8a' }
        versionCode 29
        versionName '0.4.3'
        buildConfigField 'boolean', 'BASIC_CAPTURE', 'false'
    }

    flavorDimensions 'cameraAccess'
    productFlavors {
        standard {
            dimension 'cameraAccess'
        }
        coverCompat {
            dimension 'cameraAccess'
            applicationId 'org.codeaurora.snapcam'
        }
    }

    buildTypes {
        debug { versionNameSuffix '-dev' }
        basic {
            initWith debug
            versionNameSuffix '-basic'
            buildConfigField 'boolean', 'BASIC_CAPTURE', 'true'
            resValue 'string', 'app_name', 'X Flip 相机基础版'
        }
        lab {
            initWith debug
            applicationIdSuffix '.lab'
            versionNameSuffix '-lab'
            resValue 'string', 'app_name', 'X Flip 影像实验'
        }
    }

    sourceSets.lab {
        java.srcDirs += 'src/debug/java'
        manifest.srcFile 'src/debug/AndroidManifest.xml'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { testTask ->
            maxHeapSize = '2g'
            testLogging { exceptionFormat = 'full' }
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/java.io=ALL-UNNAMED',
                    '--add-opens=java.base/java.net=ALL-UNNAMED',
                    '--add-opens=java.base/java.security=ALL-UNNAMED',
                    '--add-opens=java.base/java.text=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                    '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                    '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
            afterSuite { descriptor, result ->
                if (!descriptor.parent) println "WATERMARK_TESTS ${testTask.name}: tests=${result.testCount} failures=${result.failedTestCount} skipped=${result.skippedTestCount}"
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    implementation project(':camera-core')
    implementation 'org.opencv:opencv:4.12.0'
    implementation 'androidx.activity:activity:1.10.1'
    def cameraVersion = '1.6.2'
    implementation 'androidx.camera:camera-core:' + cameraVersion
    implementation 'androidx.camera:camera-camera2:' + cameraVersion
    implementation 'androidx.camera:camera-lifecycle:' + cameraVersion
    implementation 'androidx.camera:camera-view:' + cameraVersion
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'androidx.media3:media3-transformer:1.9.0'
    implementation 'androidx.media3:media3-effect:1.9.0'
}

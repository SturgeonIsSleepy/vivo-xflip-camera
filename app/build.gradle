plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sturgeon.xflipcamera'
    buildFeatures { buildConfig true }
    compileSdk 36

    defaultConfig {
        applicationId 'com.sturgeon.xflipcamera'
        minSdk 33
        targetSdk 36
        versionCode 18
        versionName '0.3.0-dev'
    }

    flavorDimensions 'cameraAccess'
    productFlavors {
        standard {
            dimension 'cameraAccess'
        }
        coverCompat {
            dimension 'cameraAccess'
            applicationId 'org.codeaurora.snapcam'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':camera-core')
    implementation 'androidx.activity:activity:1.10.1'
    def cameraVersion = '1.6.2'
    implementation 'androidx.camera:camera-core:' + cameraVersion
    implementation 'androidx.camera:camera-camera2:' + cameraVersion
    implementation 'androidx.camera:camera-lifecycle:' + cameraVersion
    implementation 'androidx.camera:camera-view:' + cameraVersion
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'androidx.media3:media3-transformer:1.9.0'
    implementation 'androidx.media3:media3-effect:1.9.0'
}
